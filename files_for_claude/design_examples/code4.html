<!DOCTYPE html>

<html class="dark" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>FaceAI Onboarding - Expression Reading</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700;800&amp;family=Plus+Jakarta+Sans:wght@400;500&amp;family=JetBrains+Mono:wght@500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .glass-card {
            background: rgba(26, 5, 11, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(158, 41, 65, 0.3);
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.8);
        }

        .glow-border-active {
            border-color: #9E2941;
            box-shadow: 0 0 15px rgba(158, 41, 65, 0.4);
        }

        .dot-pulse {
            animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); box-shadow: 0 0 0 0 rgba(158, 41, 65, 0.7); }
            50% { opacity: 0.8; transform: scale(1.1); box-shadow: 0 0 10px 4px rgba(158, 41, 65, 0.3); }
        }

        .bg-obsidian-gradient {
            background: radial-gradient(circle at center, #2D0A12 0%, #1A050B 100%);
        }

        .cta-glow {
            box-shadow: 0 0 20px rgba(235, 201, 131, 0.3);
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#ffdadc",
                        "primary-fixed": "#ffdf9e",
                        "surface-variant": "#34324a",
                        "on-primary": "#3f2e00",
                        "outline": "#999080",
                        "surface-dim": "#121126",
                        "surface-tint": "#e4c27d",
                        "on-primary-container": "#6c5319",
                        "background": "#121126",
                        "on-surface-variant": "#d0c5b4",
                        "secondary": "#ffb2b9",
                        "primary-container": "#ebc983",
                        "surface-container-low": "#1a192f",
                        "on-surface": "#e3dffe",
                        "surface-container-lowest": "#0d0c21",
                        "secondary-container": "#891833",
                        "primary": "#ffe7b9",
                        "surface": "#121126"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "lg": "40px",
                        "gutter": "16px",
                        "xl": "64px",
                        "container-padding": "20px",
                        "base": "4px",
                        "md": "24px",
                        "sm": "16px",
                        "xs": "8px"
                    },
                    "fontFamily": {
                        "headline-md": ["Manrope"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-sm": ["JetBrains Mono"],
                        "headline-lg": ["Manrope"],
                        "headline-lg-mobile": ["Manrope"],
                        "body-md": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "500"}],
                        "headline-lg": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["26px", {"lineHeight": "32px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}]
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-background text-on-surface font-body-md overflow-hidden selection:bg-primary-container/30">
<!-- WebGL Background Layer -->
<div class="fixed inset-0 z-0">

<div class="absolute inset-0 bg-obsidian-gradient mix-blend-multiply"></div>
</div>
<!-- Main Onboarding Shell -->
<main class="relative z-10 flex flex-col h-screen max-w-md mx-auto px-container-padding">
<!-- TopAppBar (from JSON Guidance) -->
<header class="fixed top-0 left-0 w-full z-50 flex justify-between items-center px-container-padding h-16 bg-background/80 backdrop-blur-xl border-b border-outline-variant/10">
<div class="flex items-center gap-2">
<span class="material-symbols-outlined text-primary font-bold" data-icon="auto_awesome">auto_awesome</span>
<h1 class="font-headline-md text-headline-md font-bold text-surface-tint tracking-tight">FaceAI</h1>
</div>
<div class="w-8 h-8 rounded-full bg-surface-container-high border border-outline/20 overflow-hidden">
<!-- User avatar placeholder if needed -->
</div>
</header>
<!-- Content Canvas -->
<div class="flex-1 flex flex-col justify-center items-center pt-20 pb-24">
<!-- Glassmorphic Onboarding Card -->
<section class="glass-card w-full rounded-3xl p-8 flex flex-col items-center gap-8 relative overflow-hidden">
<!-- Pagination Dots -->
<nav aria-label="Onboarding Progress" class="flex gap-3 items-center">
<div class="w-2 h-2 rounded-full bg-primary-fixed/40"></div>
<div class="w-3 h-3 rounded-full bg-[#9E2941] dot-pulse glow-border-active"></div>
<div class="w-2 h-2 rounded-full bg-primary-fixed/40"></div>
</nav>
<!-- Illustration Area -->
<div class="w-full aspect-square relative group">
<div class="absolute inset-0 bg-secondary-container/10 rounded-full blur-3xl group-hover:bg-secondary-container/20 transition-all duration-700"></div>
<img alt="3D AI Face Wireframe" class="w-full h-full object-contain relative z-10 animate-float" src="https://lh3.googleusercontent.com/aida-public/AB6AXuA7UmdOtvnzbJK6CKlh14Z0kF-Bro7N1hKQFbfJWSGHSwwc0_rHbGrDZKbdiNTmfD1gftOKeNZiFgbuoCgS7cQL7rFFvaWaSrGfDIzBfv08Coa1qBKdQBt-So5rBdEOIAinK_bgsfkwguIs8xqpcZSIXAbgtCf-sD55sMzGGB_DpajmmFgSnCuF74dIJ-anX7f_2yIuQ6V6BNACKh2iUkGMfh9I9u9i1syj73xq6g0N-xfBCQmfwh1NBjYUJsK8PgmL7qebqGQCQN87"/>
</div>
<!-- Text Content -->
<div class="text-center space-y-4">
<h2 class="font-headline-lg-mobile text-headline-lg-mobile text-primary tracking-tight">
                        AI-Powered Expression Reading
                    </h2>
<p class="font-body-md text-on-surface-variant leading-relaxed px-2">
                        Capture three distinct facets of your character through our neural matrix: <span class="text-secondary font-medium">Calm</span>, <span class="text-secondary font-medium">Bright</span>, and <span class="text-secondary font-medium">Deep</span>.
                    </p>
</div>
</section>
</div>
<!-- Fixed Bottom Action Area -->
<footer class="fixed bottom-0 left-0 w-full px-container-padding pb-10 flex flex-col items-center">
<button class="w-full max-w-xs h-14 bg-[#EBC983] text-on-primary font-headline-md rounded-full cta-glow active:scale-95 transition-all duration-200 flex items-center justify-center gap-2 group">
<span>Next</span>
<span class="material-symbols-outlined text-xl group-hover:translate-x-1 transition-transform" data-icon="arrow_forward">arrow_forward</span>
</button>
<button class="mt-4 font-label-sm text-label-sm text-on-surface-variant/60 hover:text-on-surface transition-colors uppercase tracking-widest">
                Skip Introduction
            </button>
</footer>
</main>
<style>
        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-12px); }
        }
        .animate-float {
            animation: float 6s ease-in-out infinite;
        }
    </style>
<script>
        // Micro-interaction for the CTA button
        document.querySelector('button').addEventListener('mousedown', function() {
            this.style.boxShadow = '0 0 10px rgba(235, 201, 131, 0.1)';
        });
        document.querySelector('button').addEventListener('mouseup', function() {
            this.style.boxShadow = '0 0 20px rgba(235, 201, 131, 0.3)';
        });

        // Simple parallax effect for the illustration
        document.addEventListener('mousemove', (e) => {
            const img = document.querySelector('.animate-float');
            const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
            const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
            if (img) {
                img.style.transform = `translateX(${xAxis}px) translateY(${yAxis}px)`;
            }
        });
    </script>
</body></html>
